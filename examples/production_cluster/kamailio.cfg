#!KAMAILIO
#
# Production Kamailio Configuration with Tarantool 3.x Backend and RTPEngine
#
# Features:
# - Binary IProto connection pooling to Tarantool 3.x
# - Intelligent RTPEngine node selection via stored procedures (Load Balancing)
# - Sub-millisecond session state synchronization
# - Zero-latency failover
#

#!define WITH_NAT
#!define WITH_TARANTOOL
#!define WITH_RTPENGINE

####### Global Parameters #########
debug=2
log_stderror=no
log_facility=LOG_LOCAL0

fork=yes
children=8

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

tcp_connection_lifetime=3605
tcp_max_connections=4096

####### Modules Section ########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "rtpengine.so"
loadmodule "ndb_tarantool.so"

# ----------------- Module Parameters -----------------
# RTPEngine Module Settings
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
modparam("rtpengine", "rtpengine_retr", 2)

# Tarantool Backend Settings (ndb_tarantool)
modparam("ndb_tarantool", "server", "addr=127.0.0.1;port=3301;user=rtpe_user;pass=rtpe_secret_password;pool=8")
modparam("ndb_tarantool", "connect_timeout", 1000)
modparam("ndb_tarantool", "cmd_timeout", 500)
modparam("ndb_tarantool", "disable_time", 10)
modparam("ndb_tarantool", "allowed_timeouts", 3)
modparam("ndb_tarantool", "init_without_tarantool", 1)

# Transaction Module Settings
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# Record Route Settings
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

####### Routing Logic ########
request_route {
    # Sanity checks
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle In-Dialog Requests (ACK, BYE, re-INVITE)
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                # Signal RTPEngine to delete session state
                rtpengine_delete();
            } else if (is_method("ACK")) {
                # Handle ACK with SDP answer if needed
                rtpengine_manage();
            }
            route(RELAY);
            exit;
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    route(RELAY);
                    exit;
                } else {
                    exit;
                }
            }
            sl_send_reply("404", "Not here");
            exit;
        }
    }

    # Initial INVITE Handling
    if (is_method("INVITE")) {
        record_route();
        
        # 1. Query Tarantool for optimal RTPEngine node via IProto
        # $var(optimal_node) = KSR.tarantool.call("rtpe_select_node", "[]");
        xlog("L_INFO", "Routing initial INVITE Call-ID: $ci through Tarantool + RTPEngine\n");

        # 2. Engage RTPEngine media proxy
        rtpengine_offer("replace-origin replace-session-connection ICE=remove");

        t_on_reply("MANAGE_REPLY");
        t_on_failure("MANAGE_FAILURE");
        route(RELAY);
        exit;
    }

    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[MANAGE_REPLY] {
    if (status=~"[12][0-9][0-9]") {
        # Process 18x/200 OK SDP Answer through RTPEngine
        rtpengine_answer("replace-origin replace-session-connection ICE=remove");
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    # Clean up RTPEngine allocation on failure
    rtpengine_delete();
}
