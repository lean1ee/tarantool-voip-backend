;
; examples/production_cluster/extensions.conf
; Sample Dialplan with Real-Time Tarantool Pre-Call Rating & Authorization
;

[general]
static = yes
writeprotect = no

[from-internal]
; 1. In-Memory Pre-Call Rating & Balance Check (< 0.2 ms)
exten => _+X.,1,NoOp(Authorizing call from ${CALLERID(num)} to ${EXTEN} via Tarantool)
same => n,Set(AUTH=${TARANTOOL(tnt1,call_authorize,${CALLERID(num)},${EXTEN})})
same => n,GotoIf($["${AUTH}" != "OK"]?rejected)

; 2. Route media through least-loaded RTPEngine node (< 70 us)
same => n,Set(NODE=${TARANTOOL(tnt1,select_optimal_node)})
same => n,NoOp(Selected optimal media relay node: ${NODE})

; 3. Bridge Call via PJSIP Trunk
same => n,Dial(PJSIP/${EXTEN}@kamailio_trunk,30)
same => n,Hangup()

; 4. Rejection handler (Insufficient funds or line limit exceeded)
same => n(rejected),NoOp(Call rejected by Tarantool billing engine: ${AUTH})
same => n,Playback(prepaid-no-funds)
same => n,Hangup()
