[rtpengine]

###
### Production RTPEngine Configuration with Tarantool 3.x State Synchronization
###

interface = internal/10.0.0.1;external/203.0.113.1
listen-ng = 127.0.0.1:22222
listen-cli = 127.0.0.1:9900

port-min = 30000
port-max = 49999
max-sessions = 50000

num-threads = 16
media-num-threads = 16

# ----------------- Tarantool 3.x Clustering -----------------
tarantool = 127.0.0.1:3301
tarantool-node-id = rtpe-node-01
tarantool-space = rtpe_calls
tarantool-num-threads = 8
no-tarantool-required = false
tarantool-expires = 3600
tarantool-allowed-errors = 3
tarantool-disable-time = 10
tarantool-cmd-timeout = 500
tarantool-connect-timeout = 500
tarantool-resolve-on-reconnect = true
tarantool-tcp-keepalive-time = 60
tarantool-tcp-keepalive-intvl = 5
tarantool-tcp-keepalive-probes = 3

# ----------------- Logging & Diagnostics -----------------
log-level = 6
log-stderr = false
log-facility = daemon

# ----------------- Audio Buffering -----------------
audio-buffer-length = 120
audio-buffer-delay = 10
