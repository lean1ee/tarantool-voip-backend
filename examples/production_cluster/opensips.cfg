#
# OpenSIPS 3.4 Production Configuration with cachedb_tarantool
# High-Performance Carrier-Grade Media & Signaling Cluster
#

####### Global Parameters #########
log_level=3
log_stderror=no
log_facility=LOG_LOCAL0

children=8
auto_aliases=no

listen=udp:127.0.0.1:5060

####### Modules Section ########
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "mi_fifo.so"
loadmodule "rtpengine.so"
loadmodule "cachedb_tarantool.so"

# -------- cachedb_tarantool params --------
modparam("cachedb_tarantool", "cachedb_url", "tarantool:cluster1://rtpe_user:rtpe_secret_password@127.0.0.1:3301/rtpe_calls")
modparam("cachedb_tarantool", "connect_timeout", 1000)
modparam("cachedb_tarantool", "query_timeout", 500)
modparam("cachedb_tarantool", "lazy_connect", 0)
modparam("cachedb_tarantool", "disable_time", 10)
modparam("cachedb_tarantool", "allowed_errors", 3)
modparam("cachedb_tarantool", "pool_size", 8)
modparam("cachedb_tarantool", "init_without_tarantool", 1)
modparam("cachedb_tarantool", "tcp_keepalive", 1)

# -------- usrloc params (using Tarantool CacheDB) --------
modparam("usrloc", "cachedb_url", "tarantool:cluster1://rtpe_user:rtpe_secret_password@127.0.0.1:3301/kam_usrloc")

# -------- rtpengine params --------
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

####### Routing Logic ########
route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply(200, "OK");
        exit;
    }

    # Query Tarantool stored procedure for smart node selection
    if (is_method("INVITE")) {
        tarantool_call("cluster1", "rtpe_select_node", "[]", "$var(selected_node)");
        xlog("L_INFO", "Optimal RTPEngine node selected: $var(selected_node)\n");

        rtpengine_offer("replace-origin replace-session-connection");
        t_on_reply("handle_nat");
    } else if (is_method("BYE|CANCEL")) {
        rtpengine_delete();
    }

    if (!t_relay()) {
        sl_reply_error();
    }
}

onreply_route[handle_nat] {
    if (status =~ "(183)|(200)") {
        rtpengine_answer("replace-origin replace-session-connection");
    }
}
